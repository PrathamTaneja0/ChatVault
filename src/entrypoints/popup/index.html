<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatVault Export</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <img src="/icon/48.png" alt="" class="popup-icon" width="32" height="32">
      <div>
        <h1>ChatVault Export</h1>
        <p class="subtitle">Export AI chats to PDF</p>
      </div>
    </header>

    <section class="status" id="status-section">
      <div class="status-badge" id="status-badge">Checking…</div>
      <p class="status-detail" id="status-detail"></p>
    </section>

    <section class="options">
      <label class="option-row">
        <input type="checkbox" id="opt-thinking" checked>
        <span>Include thinking/reasoning chains</span>
      </label>
      <label class="option-row">
        <input type="checkbox" id="opt-toc" checked>
        <span>Table of contents (>10 msgs)</span>
      </label>
      <label class="option-field">
        <span>Filename template</span>
        <input type="text" id="opt-filename" value="ChatVault_{title}" placeholder="ChatVault_{title}">
      </label>
    </section>

    <section class="diagnostics" id="diagnostics-section" hidden>
      <h2>Selector Diagnostics</h2>
      <ul id="diagnostics-list"></ul>
    </section>

    <footer class="popup-footer">
      <button id="btn-export" class="btn-primary" disabled>Export Chat</button>
      <p class="shortcut-hint">Shortcut: Ctrl+Shift+E</p>
    </footer>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
